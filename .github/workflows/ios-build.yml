name: iOS · Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'DeadWaxClub/**'
      - 'DeadWaxClubTests/**'
      - 'DeadWaxClubWidgets/**'
      - 'project.yml'
      - 'Config/Secrets.xcconfig.example'
      - 'Scripts/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for simulator
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SCHEME: DeadWaxClub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify shared iOS core checksums
        run: sh Scripts/check-shared-ios-core.sh

      - name: Verify shared push core checksums
        run: sh Scripts/check-shared-push-core.sh

      - name: Verify shared auth checksums
        run: sh Scripts/check-shared-auth.sh

      # Only apps that let people share their data carry the sharing core.
      - name: Verify shared sharing core checksums
        run: if [ -f Scripts/check-shared-sharing-core.sh ]; then sh Scripts/check-shared-sharing-core.sh; fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install iOS platform (if missing)
        run: sudo xcodebuild -downloadPlatform iOS || true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Write build xcconfig
        run: cp Config/Secrets.xcconfig.example Config/Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          set -o pipefail
          # Use whichever iPhone simulator the runner image ships, so a new
          # Xcode image doesn't break the job by renaming devices.
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          test -n "$simulator_id" || (echo "::error::No available iPhone simulator" && exit 1)
          xcodebuild test \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO
