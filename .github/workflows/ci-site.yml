# Shared by every app (Scripts/SHARED_SITE.md); app values come from Site/app.json.
name: Site · CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'Site/**'
      - 'Scripts/*site*'
      - 'Scripts/SHARED_SITE.md'
      - '.github/workflows/ci-site.yml'
      - '.github/workflows/release-site.yml'
      - '.github/workflows/e2e.yml'
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Placeholder public values; releases build with the repository variables.
  API_URL: https://api.invalid
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the shared site files
        run: sh Scripts/check-shared-site.sh
      - name: Install, typecheck, lint, check formatting, build and check the site
        run: |
          docker run --rm -v "$PWD:/app" -w /app/Site -e HUSKY=0 -e CI=true -e BUN_CONFIG_MAX_HTTP_REQUESTS=16 \
            -e API_URL \
            oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d sh -ec '
              bun install --frozen-lockfile --network-concurrency=16
              bun run typecheck
              bun run lint
              bun run format:check
              if [ -f scripts/write-config.mjs ]; then bun scripts/write-config.mjs; fi
              bun run build
              bun run check:site
            '
      - name: Build and smoke-test the production image
        working-directory: Site
        run: |
          docker build -t site:ci --build-arg SOURCE_REVISION="$GITHUB_SHA" --build-arg API_URL .
          docker network create platform-web
          export SITE_IMAGE=site:ci
          trap 'docker compose down; docker network rm platform-web' EXIT
          docker compose up -d --wait --wait-timeout 60
          container=$(docker compose ps -q)
          page() { docker exec "$container" wget -qO- "http://127.0.0.1:8080$1"; }
          headers() { docker exec "$container" wget -S -O /dev/null "http://127.0.0.1:8080$1" 2>&1 || true; }
          token=$(jq -r .token app.json)
          [[ "$(headers /)" == *"X-$token-Revision: $GITHUB_SHA"* ]]
          [[ "$(headers /)" == *'Cache-Control: no-cache'* ]]
          [[ "$(headers /missing-page)" == *'404 Not Found'* ]]
          asset=$(page / | grep -o '/_astro/[^"]*' | head -1)
          [[ -z "$asset" || "$(headers "$asset")" == *'immutable'* ]]
          # The app links to its pages with and without a trailing slash.
          while IFS=$'\t' read -r path content; do
            for url in "$path" "${path%/}/"; do
              [[ "$(page "$url")" == *"$content"* ]] || { echo "::error::$url does not contain \"$content\"."; exit 1; }
            done
          done < <(jq -r '(.pages + .routes) | to_entries[] | [.key, .value] | @tsv' app.json)
          if [ -f public/.well-known/apple-app-site-association ]; then
            [[ "$(headers /.well-known/apple-app-site-association)" == *'Content-Type: application/json'* ]]
          fi
          if [ -f scripts/write-config.mjs ]; then
            [[ "$(page /js/config.js)" == *"$API_URL"* ]]
          fi
