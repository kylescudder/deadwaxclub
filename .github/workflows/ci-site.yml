name: Site · CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'Site/**'
      - '.github/workflows/ci-site.yml'
      - '.github/workflows/release-site.yml'
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Placeholder public values; releases build with the repository variables.
  SUPABASE_URL: https://supabase.invalid
  SUPABASE_ANON_KEY: ci-public-anon-key
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, typecheck, lint, check formatting, build and check the site
        run: |
          docker run --rm -v "$PWD:/app" -w /app/Site -e HUSKY=0 -e CI=true -e BUN_CONFIG_MAX_HTTP_REQUESTS=16 \
            -e SUPABASE_URL -e SUPABASE_ANON_KEY \
            oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d sh -c '
              bun install --frozen-lockfile --network-concurrency=16 &&
              bun run typecheck &&
              bun run lint &&
              bun run format:check &&
              bun scripts/write-config.mjs &&
              bun run build &&
              bun run check:site'
      - name: Verify the production container without privileges
        working-directory: Site
        run: |
          docker build -t deadwaxclub:ci --build-arg DEADWAX_REVISION="$GITHUB_SHA" \
            --build-arg SUPABASE_URL --build-arg SUPABASE_ANON_KEY .
          docker network create platform-web
          trap 'DEADWAX_IMAGE=deadwaxclub:ci docker compose down; docker network rm platform-web' EXIT
          DEADWAX_IMAGE=deadwaxclub:ci docker compose up -d --wait --wait-timeout 60
          page() { docker exec deadwaxclub-deadwaxclub-1 wget -qO- "http://127.0.0.1:8080$1"; }
          headers() { docker exec deadwaxclub-deadwaxclub-1 wget -S -O /dev/null "http://127.0.0.1:8080$1" 2>&1 || true; }
          [[ "$(page /)" == *'Support for Deadwax Club'* ]]
          [[ "$(headers /)" == *"X-Deadwax-Revision: $GITHUB_SHA"* ]]
          [[ "$(headers /missing-page)" == *'404 Not Found'* ]]
          [[ "$(page /privacy)" == *'Privacy Policy'* ]]
          [[ "$(page /terms)" == *'Terms of Use'* ]]
          [[ "$(page /l/ci-share-token)" == *'/js/list.js'* ]]
          [[ "$(page /js/config.js)" == *'https://supabase.invalid'* ]]
          [[ "$(headers /.well-known/apple-app-site-association)" == *'Content-Type: application/json'* ]]
