name: Backend checks
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      [
        "Backend/**",
        ".dockerignore",
        ".github/workflows/ci-backend.yml",
        ".github/workflows/release-backend.yml",
        "Scripts/*infra*",
      ]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: backend-test-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:backend-test-only@localhost:5432/postgres
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Verify shared infrastructure checksums
        run: sh ../Scripts/check-shared-infra.sh
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - run: bun scripts/ci-database.ts
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Build candidate image
        working-directory: .
        run: docker build -f Backend/Dockerfile --build-arg SOURCE_REVISION="$GITHUB_SHA" -t backend-candidate .
