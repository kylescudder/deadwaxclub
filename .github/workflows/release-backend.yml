# Publishes a checked, attested image for every commit on main that changes the
# API (workflow_dispatch redeploys on demand), then asks Herman to deploy it. GitHub holds
# only webhook/Access credentials, never machine shell access.
name: Backend · Release

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".dockerignore"
      - "Scripts/*infra*"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/release-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  ci:
    uses: ./.github/workflows/ci-backend.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Backend/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          provenance: false
          sbom: false
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p digests
          echo "$DIGEST" > "digests/${PLATFORM//\//-}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: manifest
        name: Create multi-platform manifest
        run: |
          sources=()
          for file in digests/*; do sources+=("$IMAGE@$(cat "$file")"); done
          docker buildx imagetools create -t "$IMAGE:sha-$GITHUB_SHA" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      # Move the main tag only after the attestation exists.
      - name: Tag main
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: docker buildx imagetools create -t "$IMAGE:main" "$IMAGE@$DIGEST"

  # Asks the app's reviewed deploy-core receiver to deploy the attested digest, then
  # waits for the host to report it deployed. The host verifies the attestation,
  # backs up the database, runs owner migrations and accepts the container itself,
  # so the webhook secret can only trigger a release this workflow built from main.
  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    environment:
      name: production
    concurrency:
      group: production-api
      cancel-in-progress: false
    env:
      CONFIGURED_DEPLOY_URL: ${{ vars.API_DEPLOY_URL }}
      HEALTH_URL: ${{ vars.API_BASE_URL && format('{0}/health/live', vars.API_BASE_URL) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Load reviewed app receiver configuration
        run: |
          url="${CONFIGURED_DEPLOY_URL:-$(jq -r .deployURL Backend/deploy/app.json)}"
          [[ "$url" == https://* && "$url" != *$'\n'* ]] || { echo '::error::Configure API_DEPLOY_URL after installing the reviewed receiver.'; exit 1; }
          host=$(python3 -c 'import sys,urllib.parse; u=urllib.parse.urlsplit(sys.argv[1]); print(u.scheme+"://"+u.netloc)' "$url")
          {
            echo "DEPLOY_URL=$url"
            echo "DEPLOY_HOST=$host"
            echo "SIGNATURE_HEADER=$(jq -r .signatureHeader Backend/deploy/app.json)"
            echo "RECEIVER_HEADER=$(jq -r .receiverHeader Backend/deploy/app.json)"
          } >> "$GITHUB_ENV"
      - name: Check deploy endpoint protection
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.API_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.API_CF_ACCESS_CLIENT_SECRET }}
        run: |
          [[ -n "$CF_ACCESS_CLIENT_ID" && -n "$CF_ACCESS_CLIENT_SECRET" ]] || { echo '::error::Configure the API Cloudflare Access service-token secrets.'; exit 1; }
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --dump-header "$headers" -X POST "$DEPLOY_URL")
          [[ "$status" = 401 || "$status" = 403 ]] || { echo "::error::Cloudflare Access did not block an unauthenticated request ($status)."; exit 1; }
          ! grep -qi "^$RECEIVER_HEADER: 1" "$headers" || { echo '::error::Unauthenticated request reached the receiver.'; exit 1; }
          for path in / /healthz /other; do
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "$DEPLOY_HOST$path")
            [[ "$status" = 404 ]] || { echo "::error::Non-webhook path returned $status."; exit 1; }
          done
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --dump-header "$headers" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "$SIGNATURE_HEADER: sha256=invalid" --data '{}' "$DEPLOY_URL")
          [[ "$status" = 401 ]] || { echo "::error::Invalid webhook signature returned $status."; exit 1; }
          grep -qi "^$RECEIVER_HEADER: 1" "$headers" || { echo '::error::Service token did not reach the receiver.'; exit 1; }
      - name: Request deploy
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          WEBHOOK_SECRET: ${{ secrets.API_DEPLOY_WEBHOOK_SECRET }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.API_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.API_CF_ACCESS_CLIENT_SECRET }}
        run: |
          body=$(jq -cn --arg digest "$DIGEST" --arg revision "$GITHUB_SHA" --arg registryToken "$REGISTRY_TOKEN" --argjson timestamp "$(date +%s)" \
            '{digest: $digest, revision: $revision, timestamp: $timestamp, registryToken: $registryToken}')
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $NF}')
          curl --fail-with-body --silent --show-error --max-time 30 "$DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -H "$SIGNATURE_HEADER: sha256=$signature" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --data "$body"
      - name: Wait for host acceptance
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.API_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.API_CF_ACCESS_CLIENT_SECRET }}
        run: |
          for _attempt in $(seq 60); do
            accepted=$(curl --fail --silent --max-time 10 \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$DEPLOY_URL" \
              | jq -r --arg revision "$GITHUB_SHA" --arg image "$IMAGE@$DIGEST" \
                'if .revision == $revision and .image == $image then .status else "pending" end' || true)
            if [ "$accepted" = deployed ]; then
              if [ -n "$HEALTH_URL" ]; then
                curl --fail --silent --show-error --max-time 10 --output /dev/null "$HEALTH_URL" \
                  || { echo "::error::Host accepted $GITHUB_SHA but $HEALTH_URL is not live."; exit 1; }
              fi
              echo "Herman migrated, accepted and is running \`$IMAGE@$DIGEST\` ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Herman did not report $GITHUB_SHA deployed within 10 minutes. Check this API application deploy-core log on the host."
          exit 1
